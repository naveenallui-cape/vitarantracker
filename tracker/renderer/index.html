<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Vitarantracker</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main>
      <p class="eyebrow">Company-owned Windows laptop</p>
      <h1>Vitarantracker</h1>
      <p class="lede">
        One-time setup. After this laptop is registered it runs in the
        background. There is no daily login or logout. Admin unlinks the device
        to stop tracking.
      </p>
      <p id="notice" class="notice" hidden></p>
      <form id="register" hidden>
        <label>
          Backend URL
          <input name="backendUrl" required value="http://localhost:4000" />
        </label>
        <label>
          Employee ID
          <input name="employeeId" required placeholder="EMP001" />
        </label>
        <label>
          Registration code
          <input name="registrationCode" required placeholder="AB7K-92PX" />
        </label>
        <label>
          Device name
          <input name="deviceName" placeholder="Optional laptop name" />
        </label>
        <label class="consent">
          <input type="checkbox" name="consent" required />
          I understand this company-owned Windows laptop reports activity and
          inactivity state to Vitarantracker.
        </label>
        <p id="error" class="error"></p>
        <button type="submit">Register this Windows laptop</button>
      </form>
      <p id="background" class="lede" hidden>
        This laptop is connected. The tracker is running in the background.
      </p>
    </main>
    <script src="./app.js"></script>
  </body>
</html>
