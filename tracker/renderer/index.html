<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Vitarantracker</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main>
      <p class="eyebrow">Company-owned Windows laptop</p>
      <h1>Vitarantracker</h1>
      <p class="lede">
        This agent reports only activity and inactivity state: active, idle,
        locked, unlocked, and heartbeat. It never captures keystrokes, typed
        text, screenshots, clipboard, URLs, or mouse coordinates.
      </p>
      <p id="notice" class="notice" hidden></p>
      <section id="registered" hidden>
        <p class="status-label">Current state</p>
        <p id="status" class="status">ACTIVE</p>
        <dl>
          <div><dt>Employee ID</dt><dd id="employeeId"></dd></div>
          <div><dt>Device</dt><dd id="deviceName"></dd></div>
          <div><dt>Hostname</dt><dd id="hostname"></dd></div>
        </dl>
        <button id="unregister">Remove this device from this laptop</button>
      </section>
      <form id="register" hidden>
        <label>
          Backend URL
          <input name="backendUrl" required value="http://localhost:4000" />
        </label>
        <label>
          Employee ID
          <input name="employeeId" required placeholder="EMP001" />
        </label>
        <label>
          Registration code
          <input name="registrationCode" required placeholder="AB7K-92PX" />
        </label>
        <label>
          Device name
          <input name="deviceName" placeholder="Optional laptop name" />
        </label>
        <label class="consent">
          <input type="checkbox" name="consent" required />
          I understand this company-owned Windows laptop reports activity and
          inactivity state to Vitarantracker.
        </label>
        <p id="error" class="error"></p>
        <button type="submit">Register this Windows laptop</button>
      </form>
    </main>
    <script src="./app.js"></script>
  </body>
</html>
